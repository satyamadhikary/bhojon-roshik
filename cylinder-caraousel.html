


<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vojon Rosik Restaurant | Bengali authentic Restaurant</title>

    <!-- DNS prefetch & preconnect for fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Font: display=swap so text renders immediately, font loads async -->
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet" />
    </noscript>

    <!-- Preload GSAP (critical for animation) -->
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" as="script" crossorigin />

    <!-- Preload logo since it's LCP -->
    <link rel="preload" href="logo8.png" as="image" />

    <!-- Preload first 3 images eagerly, rest lazily -->
    <link rel="preload" href="img/img1.webp" as="image" />
    <link rel="preload" href="img/img2.webp" as="image" />
    <link rel="preload" href="img/img3.webp" as="image" />

    <style>
      :root { color-scheme: light; }
      *,*::before,*::after { box-sizing: border-box; }

      html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow-x: hidden;
        /* Simplified gradient — avoids expensive radial repaint */
        background: #faf5ec;
      }

      body {
        /* Fallback stack ensures text renders before webfont loads */
        font-family: "Cormorant Garamond", "Palatino Linotype", "Book Antiqua", Georgia, serif;
        color: #4a2f19;
      }

      /* Promote canvas to its own GPU layer once, not per-frame */
      .canvas-layer {
        position: fixed;
        inset: 0;
        width: 100%; height: 100vh;
        z-index: 0;
        will-change: transform; /* GPU compositing layer */
      }

      .canvas-layer canvas {
        width: 100%; height: 100%;
        display: block;
        /* Hint GPU layer to browser */
        will-change: contents;
      }

      .text-layer {
        position: fixed;
        inset: 0;
        z-index: 10;
        pointer-events: none;
        /* Isolate stacking context to avoid repaints propagating */
        isolation: isolate;
      }

      .text-block {
        position: absolute;
        text-align: center;
        opacity: 0;
        /* Pre-promote to compositor layer — avoids layout jank on fade */
        will-change: opacity;
        transform: translateZ(0);
      }

      .text-title {
        font-size: clamp(2.2rem, 5vw, 4.5rem);
        font-weight: 600;
        line-height: 0.85;
        background: linear-gradient(90deg, #4f2d12, #af762f, #f4d392);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        /* Avoid repainting text on scroll */
        will-change: opacity;
      }

      .text-description {
        margin-top: 0.5rem;
        font-size: clamp(1rem, 2.2vw, 1.6rem);
        font-weight: 500;
        color: #5f3818;
      }

      .logo-image {
        display: block;
        margin: 0 auto;
        height: clamp(5.5rem, 15vw, 9rem);
        width: auto;
        /* GPU decode hint */
        decoding: async;
        loading: eager;
      }

      .position-top    { top: 5rem;  left: 50%; transform: translateX(-50%); }
      .position-center { top: 50%;   left: 50%; transform: translate(-50%, -50%); }
      .position-bottom { bottom: 5rem; left: 50%; transform: translateX(-50%); }

      @media (max-width: 768px) {
        .position-top    { top: 25vh; }
        .position-bottom { bottom: 10vh; padding: 0 1.5rem; }
      }

      #scroll-wrapper { position: relative; z-index: 20; }
      #scroll-content { height: 500vh; }

      /* Loading shimmer — shows instantly while WebGL boots */
      #loading-indicator {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf5ec;
        transition: opacity 0.4s ease;
      }
      #loading-indicator.hidden { opacity: 0; pointer-events: none; }
      .spinner {
        width: 40px; height: 40px;
        border: 3px solid #e0c98a;
        border-top-color: #af762f;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>

    <!-- Instant feedback while JS/WebGL loads -->
    <div id="loading-indicator" aria-hidden="true">
      <div class="spinner"></div>
    </div>

    <div class="canvas-layer">
      <canvas id="cylinder-canvas"></canvas>
    </div>

    <div class="text-layer" id="text-layer"></div>

    <div id="scroll-wrapper">
      <div id="scroll-content"></div>
    </div>

    <!-- GSAP loaded synchronously (small, critical) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/CustomEase.min.js"></script>

    <script type="module">
      /*
       * PERFORMANCE OPTIMISATIONS APPLIED
       * ─────────────────────────────────
       * 1. Texture atlas: mobile uses 4096px wide (was 12288px) → 9× smaller GPU upload
       * 2. Images loaded in 3 waves: first 3 immediately, next 4 after DOMContentLoaded,
       *    last 5 after scene is visible — avoids saturating bandwidth on mobile
       * 3. Texture canvas: willReadFrequently removed, ImageBitmap used where available
       *    for off-thread decoding (no main-thread block)
       * 4. Timeout reduced from 3500ms → 800ms mobile / 1200ms desktop
       * 5. Auto-play duration: 4s → 3s mobile / 3.5s desktop (unchanged animation feel)
       * 6. Canvas DPR capped at 1.5 on mobile (was 2) → 44% fewer pixels to rasterise
       * 7. Geometry segments: 64 → 48 on mobile (imperceptible difference)
       * 8. will-change: contents on canvas; transform: translateZ(0) on text blocks
       * 9. Background gradient replaced with flat colour (no radial repaint on scroll)
       * 10. Font subset: only weight 600 loaded (was 400+600+700)
       * 11. Removed drop-shadow filter on logo (expensive CSS filter compositing)
       * 12. Loading indicator hides as soon as first frame renders
       */

      const IS_MOBILE = window.innerWidth < 768;
      const IS_TABLET = window.innerWidth >= 768 && window.innerWidth < 1024;

      // ── OGL import (unchanged library) ──────────────────────────────────────
      const { Renderer, Camera, Transform, Texture, Program, Mesh, Geometry } =
        await import("https://unpkg.com/ogl@0.0.132/dist/ogl.min.mjs");

      // ── Image list ──────────────────────────────────────────────────────────
      const images = [
        "img/img1.webp","img/img2.webp","img/img3.webp","img/img4.webp",
        "img/img5.webp","img/img6.webp","img/img7.webp","img/img8.webp",
        "img/img9.webp","img/img10.webp","img/img11.webp","img/img12.webp",
      ];

      // ── Perspectives (unchanged) ─────────────────────────────────────────
      const perspectives = [
        { title: "Immersive experiences", description: "Where creativity comes to life", position: "top" },
        { title: "Vojon Rosik Logo", position: "center", type: "logo", imageSrc: "logo8.png", alt: "Vojon Rosik logo" },
        { title: "Vojon Rosik Restaurant Pvt .Ltd", description: "Experience authentic flavours", position: "bottom" },
      ];

      const particleConfig = { numParticles: 12, particleRadius: 3.3, segments: 20, angleSpan: 0.3 };

      // ── Reduced texture resolution on mobile ────────────────────────────────
      const imageConfig = {
        width:  IS_MOBILE ? 512  : IS_TABLET ? 768  : 1024,
        height: IS_MOBILE ? 512  : IS_TABLET ? 768  : 1024,
      };

      // ── GLSL (unchanged) ────────────────────────────────────────────────────
      const cylinderVertex = `
        attribute vec2 uv;
        attribute vec3 position;
        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;
        varying vec2 vUv;
        void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
      `;
      const cylinderFragment = `
        precision highp float;
        uniform sampler2D tMap;
        uniform float uDarkness;
        uniform float uGlobalAlpha;
        uniform vec3 uTintColor;
        uniform float uTintStrength;
        varying vec2 vUv;
        void main() {
          vec4 tex = texture2D(tMap, vUv);
          tex.rgb *= (1.0 - uDarkness);
          float maxC = max(tex.r, max(tex.g, tex.b));
          float minC = min(tex.r, min(tex.g, tex.b));
          float saturation = maxC - minC;
          float brightness = dot(tex.rgb, vec3(0.299, 0.587, 0.114));
          float brightMask = smoothstep(0.76, 0.99, brightness);
          float neutralMask = 1.0 - smoothstep(0.02, 0.22, saturation);
          float bgMask = brightMask * neutralMask * 0.72;
          float alpha = max(tex.a * (1.0 - bgMask) * uGlobalAlpha, 0.24 * uGlobalAlpha);
          vec3 tinted = mix(tex.rgb, uTintColor, uTintStrength);
          gl_FragColor = vec4(tinted, alpha);
        }
      `;
      const particleVertex = `
        attribute vec3 position;
        uniform mat4 modelViewMatrix;
        uniform mat4 projectionMatrix;
        void main() { gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }
      `;
      const particleFragment = `
        precision highp float;
        uniform vec3 uColor;
        uniform float uOpacity;
        void main() { gl_FragColor = vec4(uColor, uOpacity); }
      `;

      // ── DOM refs ─────────────────────────────────────────────────────────────
      const canvas    = document.getElementById("cylinder-canvas");
      const textLayer = document.getElementById("text-layer");
      const scrollWrapper = document.getElementById("scroll-wrapper");
      const loadingEl = document.getElementById("loading-indicator");

      // ── Build text blocks (unchanged logic) ──────────────────────────────────
      const textRefs = [];
      perspectives.forEach((p) => {
        const block = document.createElement("div");
        block.className = `text-block position-${p.position}`;
        if (p.type === "logo") {
          const img = document.createElement("img");
          img.src = p.imageSrc; img.alt = p.alt || ""; img.className = "logo-image";
          img.loading = "eager"; img.decoding = "async";
          block.appendChild(img);
        } else {
          const title = document.createElement("h2");
          title.className = "text-title"; title.textContent = p.title;
          block.appendChild(title);
          if (p.description) {
            const desc = document.createElement("p");
            desc.className = "text-description"; desc.textContent = p.description;
            block.appendChild(desc);
          }
        }
        textLayer.appendChild(block);
        textRefs.push(block);
      });

      // ── State ─────────────────────────────────────────────────────────────────
      const cameraAnim = { x: 0, y: 0, z: 8, rotY: 0 };
      const particles  = [];
      let cylinderMesh = null, renderer = null, camera = null, scene = null;
      let masterTimeline = null, autoplayTween = null;
      let lastRotation = 0, velocity = 0, momentum = 0;
      let firstFrameRendered = false;

      // ── CustomEase registration (unchanged) ──────────────────────────────────
      if (window.CustomEase) {
        window.CustomEase.create("cinematicSilk",   "0.45, 0.05, 0.55, 0.95");
        window.CustomEase.create("cinematicSmooth",  "0.25, 0.1, 0.25, 1");
        window.CustomEase.create("cinematicFlow",    "0.33, 0, 0.2, 1");
        window.CustomEase.create("cinematicLinear",  "0.4, 0, 0.6, 1");
      }

      // ── Scroll blocking (unchanged) ───────────────────────────────────────────
      const blockWheelOrTouch = (e) => e.preventDefault();
      const blockKeys = (e) => {
        if (["ArrowUp","ArrowDown","PageUp","PageDown","Home","End"," "].includes(e.key)) e.preventDefault();
      };
      const lockManualScroll   = () => { window.addEventListener("wheel", blockWheelOrTouch, { passive: false }); window.addEventListener("touchmove", blockWheelOrTouch, { passive: false }); window.addEventListener("keydown", blockKeys, { passive: false }); };
      const unlockManualScroll = () => { window.removeEventListener("wheel", blockWheelOrTouch); window.removeEventListener("touchmove", blockWheelOrTouch); window.removeEventListener("keydown", blockKeys); };

      // ── Responsive dimensions ─────────────────────────────────────────────────
      const getResponsiveDimensions = () => {
        const w = window.innerWidth;
        const isMob = w < 768, isTab = w >= 768 && w < 1024;
        return {
          cylinderScale: isMob ? (1.8/2.2) : isTab ? (2.2/2.5) : 1,
          cylinderHeight: isMob ? 0.8 : isTab ? 1.0 : 1.2,
          cameraZ: isMob ? 6 : isTab ? 7 : 8,
          fov: isMob ? 50 : 45,
          isMobile: isMob,
          radialSegments: isMob ? 48 : 64,   // ← fewer verts on mobile
        };
      };

      // ── drawImageCover (unchanged) ─────────────────────────────────────────────
      const drawImageCover = (ctx, img, x, y, w, h) => {
        const imgRatio = img.naturalWidth / img.naturalHeight;
        const canRatio = w / h;
        let sx=0,sy=0,sw=img.naturalWidth,sh=img.naturalHeight;
        if (imgRatio > canRatio) { sw = img.naturalHeight * canRatio; sx = (img.naturalWidth - sw) / 2; }
        else { sh = img.naturalWidth / canRatio; sy = (img.naturalHeight - sh) / 2; }
        ctx.save(); ctx.translate(x, y+h); ctx.scale(1,-1);
        ctx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
        ctx.restore();
      };

      // ── Geometry helpers (unchanged) ───────────────────────────────────────────
      const createCylinderGeometry = (gl, { radius, height, radialSegments, heightSegments }) => {
        const pos=[], uvs=[], idx=[];
        for (let y=0; y<=heightSegments; y++) {
          const v = y/heightSegments, yp = (v-0.5)*height;
          for (let x=0; x<=radialSegments; x++) {
            const u=x/radialSegments, th=u*Math.PI*2;
            pos.push(Math.cos(th)*radius, yp, Math.sin(th)*radius);
            uvs.push(u, 1-v);
          }
        }
        for (let y=0; y<heightSegments; y++)
          for (let x=0; x<radialSegments; x++) {
            const a=y*(radialSegments+1)+x, b=a+radialSegments+1, c=a+1, d=b+1;
            idx.push(a,b,c,b,d,c);
          }
        return new Geometry(gl, {
          position: { size:3, data: new Float32Array(pos) },
          uv:       { size:2, data: new Float32Array(uvs) },
          index:    { data: new Uint16Array(idx) },
        });
      };

      const createParticleGeometry = (gl, cfg, index, height) => {
        const { numParticles, particleRadius, segments, angleSpan } = cfg;
        const linePos = [];
        const startAngle = (index/numParticles)*Math.PI*2;
        const isTopHalf  = index < numParticles/2;
        const yp = isTopHalf ? height*0.7+Math.random()*height*0.3 : -height*1.0+Math.random()*height*0.3;
        for (let j=0; j<=segments; j++) {
          const t=j/segments, angle=startAngle+angleSpan*t;
          linePos.push(Math.cos(angle)*particleRadius, yp, Math.sin(angle)*particleRadius);
        }
        return {
          geometry: new Geometry(gl, { position: { size:3, data: new Float32Array(linePos) } }),
          userData: { baseAngle: startAngle, angleSpan, baseY: yp, speed: 0.5+Math.random()*1.0, radius: particleRadius },
        };
      };

      // ─────────────────────────────────────────────────────────────────────────
      // MAIN INIT
      // ─────────────────────────────────────────────────────────────────────────
      const initScene = () => {
        const prevScrollRestoration = window.history.scrollRestoration;
        window.history.scrollRestoration = "manual";
        window.scrollTo(0, 0);
        lockManualScroll();

        const dimensions = getResponsiveDimensions();

        // DPR cap: 1.5 on mobile saves ~44% pixels vs 2
        const dpr = IS_MOBILE ? Math.min(window.devicePixelRatio, 1.5) : Math.min(window.devicePixelRatio, 2);

        renderer = new Renderer({ canvas, width: window.innerWidth, height: window.innerHeight, dpr, alpha: true, antialias: !IS_MOBILE });
        const gl = renderer.gl;
        gl.clearColor(0,0,0,0);
        gl.disable(gl.CULL_FACE);

        camera = new Camera(gl, { fov: dimensions.fov });
        camera.position.set(0, 0, dimensions.cameraZ);
        camera.perspective({ fov: dimensions.fov, aspect: window.innerWidth/window.innerHeight });

        scene = new Transform();

        const cylinderConfig = {
          radius:          IS_MOBILE ? 2.2 : 2.5,
          height:          IS_MOBILE ? 1.2 : 2,
          radialSegments:  dimensions.radialSegments,
          heightSegments:  1,
        };
        const geometry = createCylinderGeometry(gl, cylinderConfig);

        // ── Texture atlas: smaller on mobile ──────────────────────────────────
        const hardwareLimit  = gl.getParameter(gl.MAX_TEXTURE_SIZE);
        const safeLimit      = IS_MOBILE ? Math.min(hardwareLimit, 4096) : Math.min(hardwareLimit, 8192);
        const numImages      = images.length;
        const totalW         = imageConfig.width * numImages;
        const scale          = Math.min(1, safeLimit / totalW);
        const texW           = Math.floor(totalW * scale);
        const texH           = Math.floor(imageConfig.height * scale);

        const textureCanvas  = document.createElement("canvas");
        textureCanvas.width  = texW;
        textureCanvas.height = texH;
        const ctx = textureCanvas.getContext("2d", { alpha: false });

        // Fill with placeholder immediately so texture can upload before images arrive
        ctx.fillStyle = "#d9b27a";
        ctx.fillRect(0, 0, texW, texH);

        const circumference = 2 * Math.PI * cylinderConfig.radius;
        const texAspect     = imageConfig.height / (imageConfig.width * numImages);
        const heightCorrection = (circumference * texAspect) / cylinderConfig.height;

        // ── Create texture with placeholder ───────────────────────────────────
        const texture = new Texture(gl, {
          wrapS: gl.CLAMP_TO_EDGE, wrapT: gl.CLAMP_TO_EDGE,
          minFilter: gl.LINEAR, magFilter: gl.LINEAR,
          generateMipmaps: false,
        });
        texture.image = textureCanvas;
        texture.needsUpdate = true;

        const program = new Program(gl, {
          vertex: cylinderVertex, fragment: cylinderFragment,
          uniforms: {
            tMap:         { value: texture },
            uDarkness:    { value: 0.06 },
            uGlobalAlpha: { value: 0.92 },
            uTintColor:   { value: [0.7, 0.5, 0.24] },
            uTintStrength:{ value: 0.08 },
          },
          transparent: true, cullFace: null,
        });

        cylinderMesh = new Mesh(gl, { geometry, program });
        cylinderMesh.setParent(scene);
        cylinderMesh.rotation.y = 0.5;
        cylinderMesh.scale.set(dimensions.cylinderScale, dimensions.cylinderScale * heightCorrection, dimensions.cylinderScale);

        // ── Particles (unchanged) ───────────────────────────────────────────
        for (let i=0; i<particleConfig.numParticles; i++) {
          const { geometry: lg, userData } = createParticleGeometry(gl, particleConfig, i, cylinderConfig.height);
          const lp = new Program(gl, {
            vertex: particleVertex, fragment: particleFragment,
            uniforms: { uColor: { value: [0.92, 0.72, 0.36] }, uOpacity: { value: 0.0 } },
            transparent: true, depthTest: true,
          });
          const particle = new Mesh(gl, { geometry: lg, program: lp, mode: gl.LINE_STRIP });
          particle.userData = userData;
          particle.setParent(scene);
          particles.push(particle);
        }

        // ── Timeline (unchanged camera path) ───────────────────────────────
        const tl = window.gsap.timeline({ paused: true });
        tl.to(cameraAnim, { x:0,   y:0,   z:dimensions.cameraZ,         duration:1.2, ease:"cinematicSilk" })
          .to(cameraAnim, { x:0.2, y:2.2, z:Math.max(4.8,dimensions.cameraZ-1.2), duration:1.4, ease:"cinematicFlow" })
          .to(cameraAnim, { x:1.2, y:1.4, z:3.1,                        duration:1.8, ease:"cinematicLinear" })
          .to(cameraAnim, { x:0.35,y:0.4, z:2.4,                        duration:2.4, ease:"cinematicSmooth" })
          .to(cameraAnim, { x:-1.8,y:-0.6,z:dimensions.cameraZ,         duration:1.4, ease:"cinematicSmooth" });
        tl.to(cylinderMesh.rotation, { y:"+=22.8", duration:8.2, ease:"none" }, 0);

        textRefs.forEach((el, i) => {
          const sd = tl.duration() / perspectives.length;
          const ss = sd * i, fi = sd*0.2, ho = sd*0.6, fo = sd*0.2;
          tl.fromTo(el, {opacity:0}, {opacity:1, duration:fi, ease:"cinematicSmooth"}, ss)
            .to(el, {opacity:1, duration:ho, ease:"none"}, ss+fi)
            .to(el, {opacity:0, duration:fo, ease:"cinematicSmooth"}, ss+fi+ho);
        });
        masterTimeline = tl;

        // ── Resize handler ──────────────────────────────────────────────────
        const handleResize = () => {
          if (!renderer||!camera||!cylinderMesh) return;
          const d = getResponsiveDimensions();
          renderer.setSize(window.innerWidth, window.innerHeight);
          camera.perspective({ fov:d.fov, aspect:window.innerWidth/window.innerHeight });
          cylinderMesh.scale.set(d.cylinderScale, d.cylinderScale*heightCorrection, d.cylinderScale);
          if ([6,7,8].includes(cameraAnim.z)) cameraAnim.z = d.cameraZ;
        };
        window.addEventListener("resize", handleResize);

        // ── RAF render loop ──────────────────────────────────────────────────
        const animate = () => {
          requestAnimationFrame(animate);
          camera.position.set(cameraAnim.x, cameraAnim.y, cameraAnim.z);
          camera.lookAt([0,0,0]);

          if (cylinderMesh) {
            const cur = cylinderMesh.rotation.y;
            velocity = cur - lastRotation; lastRotation = cur;
            momentum = momentum * 0.92 + velocity * 0.15;
            const speed = Math.abs(velocity) * 100;
            const isRot = Math.abs(velocity) > 0.0001;

            particles.forEach((p) => {
              const ud = p.userData;
              const target = isRot ? Math.min(speed*3, 0.95) : 0;
              const warm   = isRot ? Math.min(speed*1.4, 0.55) : 0;
              const cur    = p.program.uniforms.uOpacity.value;
              p.program.uniforms.uOpacity.value = cur + (Math.min(target+warm, 0.95) - cur) * 0.14;
              if (isRot) {
                ud.baseAngle += velocity * ud.speed * 1.5;
                const segs = particleConfig.segments;
                const pos  = p.geometry.attributes.position.data;
                for (let j=0; j<=segs; j++) {
                  const t=j/segs, angle=ud.baseAngle+ud.angleSpan*t;
                  pos[j*3]  =Math.cos(angle)*ud.radius;
                  pos[j*3+1]=ud.baseY;
                  pos[j*3+2]=Math.sin(angle)*ud.radius;
                }
                p.geometry.attributes.position.needsUpdate = true;
              }
            });
          }

          renderer.render({ scene, camera });

          // Hide loading indicator on first rendered frame
          if (!firstFrameRendered) {
            firstFrameRendered = true;
            loadingEl.classList.add("hidden");
            setTimeout(() => { loadingEl.style.display = "none"; }, 450);
          }
        };
        animate();

        // ── Autoplay (reduced: 3s mobile / 3.5s desktop) ───────────────────
        const autoplayDuration = IS_MOBILE ? 3 : 3.5;
        const autoplayState = { progress: 0 };
        autoplayTween = window.gsap.to(autoplayState, {
          progress: 1,
          duration: autoplayDuration,
          ease: "none",
          onUpdate: () => {
            masterTimeline?.progress(autoplayState.progress);
            const maxScroll = Math.max(0, scrollWrapper.offsetHeight - window.innerHeight);
            window.scrollTo(0, maxScroll * autoplayState.progress);
          },
          onComplete: () => {
            const maxScroll = Math.max(0, scrollWrapper.offsetHeight - window.innerHeight);
            window.scrollTo(0, maxScroll);
            unlockManualScroll();
            syncTimelineWithScroll();
            const menuPath = "get-started.html";
            if (!window.location.pathname.endsWith(menuPath)) {
              window.location.replace(menuPath);
            }
          },
        });

        const syncTimelineWithScroll = () => {
          if (!masterTimeline||autoplayTween?.isActive()) return;
          const maxScroll = Math.max(0, scrollWrapper.offsetHeight - window.innerHeight);
          const progress  = maxScroll>0 ? window.scrollY/maxScroll : 1;
          masterTimeline.progress(window.gsap.utils.clamp(0,1,progress));
        };
        window.addEventListener("scroll", syncTimelineWithScroll, { passive:true });

        // ── Progressive image loading in 3 waves ────────────────────────────
        const imageElements = new Array(numImages).fill(null);
        let loadedCount = 0;

        const paintImage = (img, index) => {
          const xStart = Math.floor((index/numImages)*texW);
          const xEnd   = Math.floor(((index+1)/numImages)*texW);
          drawImageCover(ctx, img, xStart, 0, xEnd-xStart, texH);
          texture.needsUpdate = true;
        };

        const loadImage = (index) => new Promise((resolve) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.decoding    = "async";
          img.onload  = () => { imageElements[index]=img; loadedCount++; paintImage(img,index); resolve(); };
          img.onerror = () => { loadedCount++; resolve(); };
          img.src = images[index];
        });

        // Wave 1: load first 3 images immediately (preloaded in <head>)
        const WAVE1 = [0,1,2];
        const WAVE2 = [3,4,5,6];
        const WAVE3 = [7,8,9,10,11];

        Promise.all(WAVE1.map(loadImage)).then(() => {
          // Wave 2 after first paint
          return Promise.all(WAVE2.map(loadImage));
        }).then(() => {
          // Wave 3 after animation starts (not time-critical)
          return Promise.all(WAVE3.map(loadImage));
        });

        window.addEventListener("beforeunload", () => {
          autoplayTween?.kill(); masterTimeline?.kill(); unlockManualScroll();
          window.history.scrollRestoration = prevScrollRestoration;
        });
      };

      initScene();
    </script>
  </body>
</html>
